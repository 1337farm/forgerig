[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
rig-core = "0.4.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = "0.21"
futures-util = "0.3"
thiserror = "2.0.20"
wasmi = "0.36.0"
wat = "1.0.83"
base64 = "0.22.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio-rusqlite = "0.6.0"
openssl-sys = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4.45"
schemars = "0.8.22"

[features]
# rig-core pulls reqwest with default TLS (native-tls -> openssl-sys). For the
# static aarch64-musl CI build there is no system OpenSSL for that target, so we
# vendor OpenSSL (built by the musl cross gcc) via this opt-in feature. Local
# host builds use the system OpenSSL and don't need it.
vendored-openssl = ["openssl-sys/vendored"]
