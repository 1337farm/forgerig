<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>ForgeRig</title>
<style>
  @font-face {
    font-family: 'Intel One Mono';
    font-style: normal; font-weight: 400; font-display: swap;
    src: url('/font.woff2') format('woff2');
  }
  :root {
    color-scheme: dark;
    /* ForgeRig neon theme, sampled from the logo coin: magenta glow on
       near-black violet. */
    --bg: #0b0a12;
    --panel: #151221;
    --panel-2: #1c162e;
    --line: #2c2145;
    --accent: #d946ef;
    --accent-soft: #a855f7;
    --accent-deep: #9333ea;
    --link: #e879f9;
    --ink: #ece7f5;
    --muted: #8c93a3;
    --ok: #7cf787;
    --warn: #e6c07b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Intel One Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: .5rem .8rem; border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  /* Lean install overlay - shown while Lean is provisioning */
  #lean-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--bg); color: var(--ink);
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: .7rem; padding: 1.2rem 1rem; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #lean-overlay.active { display: flex; }
  #lean-overlay .logo { font-size: 2.5rem; color: var(--accent); flex: 0 0 auto; }
  #lean-overlay .title { font-size: 1.1rem; font-weight: 600; flex: 0 0 auto; }
  #lean-overlay .detail { font-size: .85rem; color: var(--muted); max-width: 80%; text-align: center; flex: 0 0 auto; }
  #lean-overlay .progress-bar { width: 100%; max-width: 320px; height: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: 0 0 auto; }
  #lean-overlay .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-deep), var(--accent)); }
  #lean-overlay .pct { font-size: .8rem; color: var(--ink); flex: 0 0 auto; }
  /* Install checklist: done/current/remaining at a glance. Scrollable on
     small screens; the current step auto-scrolls into view (user scroll
     otherwise untouched). */
  #lean-overlay .steps-list {
    width: 100%; max-width: 320px; max-height: 38vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; text-align: left; flex: 0 1 auto;
  }
  #lean-overlay .steps-list .step {
    padding: .35rem .55rem; margin: .25rem 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; font-size: .78rem; color: var(--muted);
  }
  #lean-overlay .steps-list .step.done { color: var(--ok); text-decoration: line-through; }
  #lean-overlay .steps-list .step.current { color: var(--ink); font-weight: 600; border-color: var(--accent-soft); }
  #lean-overlay .steps-list .step.current .dot {
    display: inline-block; width: 9px; height: 9px; margin-right: 6px;
    border-radius: 50%; background-color: var(--accent); animation: tblink 1.2s infinite;
  }
  @keyframes tblink { 50% { opacity: 0.25; } }
  .row { display: flex; align-items: center; gap: .5rem; }
  .row.between { justify-content: space-between; }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 600; color: var(--accent); }
  .brand { display: flex; align-items: center; gap: .45rem; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  .brand .dot.busy { background: var(--accent); animation: tblink 1.2s infinite; }
  .brand .dot.error { background: #ff7b72; }
  #status-pill {
    font-size: .68rem; color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 999px; padding: .15rem .55rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw;
  }
  #status { color: var(--ok); font-size: .78rem; }
  #provider-line { display: flex; align-items: center; gap: .4rem; min-width: 0; }
  #provider { color: var(--accent-soft); font-size: .72rem; font-family: monospace; word-break: break-all; flex: 1 1 auto; min-width: 0; }
  .pill {
    font-size: .66rem; border: 1px solid var(--line); border-radius: 999px;
    padding: .12rem .5rem; color: var(--muted); background: var(--panel);
    white-space: nowrap; flex: 0 0 auto;
  }
  .pill.key-ok { color: var(--ok); border-color: var(--ok); }
  .pill.key-missing { color: #ff7b72; border-color: #ff7b72; }
  .pill.lean-ok { color: var(--ok); border-color: var(--ok); }
  .pill.lean-warn { color: var(--warn); border-color: var(--warn); }
  button { cursor: pointer; }
  #settings-btn, #lean-btn {
    background: #333; color: var(--ink); border: 1px solid #555; border-radius: 6px;
    padding: .35rem .6rem; font-size: .78rem;
  }
  #lean-status { color: var(--warn); font-size: .78rem; }
  #lean-bar {
    display: none; margin: .35rem 0 0; height: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    position: relative;
  }
  #lean-fill {
    height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-deep), var(--accent));
  }
  #lean-pct {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: .55rem; line-height: 1;
    white-space: nowrap; pointer-events: none;
  }
  #setup-notice {
    display: none; margin: .35rem 0 0; padding: .45rem .6rem; font-size: .78rem;
    background: var(--panel-2); border: 1px solid var(--accent-soft);
    border-radius: 8px; color: var(--ink);
  }
  #setup-notice button {
    background: var(--accent-deep); color: #fff; border: 1px solid var(--accent-soft);
    border-radius: 6px; padding: .25rem .6rem; font-size: .75rem; margin-left: .4rem;
  }
  #tabs {
    display: flex; gap: .3rem; padding: .4rem .6rem 0;
    overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .tab {
    display: flex; align-items: center; gap: .2rem; flex: 0 0 auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
    padding: 0; overflow: hidden;
  }
  .tab.active { background: var(--panel-2); border-bottom-color: var(--panel-2); }
  .tab-label {
    background: transparent; border: 0; color: #c7cdd8; padding: .4rem .55rem;
    font-size: .8rem; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tab-close {
    background: transparent; border: 0; color: #777; padding: 0 .35rem; font-size: .9rem;
  }
  .tab-close:hover { color: #ff7b72; }
  #new-session {
    flex: 0 0 auto; background: var(--accent-deep); border: 1px solid var(--accent-soft); color: #fff;
    border-radius: 8px; padding: .35rem .6rem; font-size: .8rem;
  }
  #history-btn {
    flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: .35rem .55rem; font-size: .8rem;
  }
  #branch-pager {
    display: none; gap: .3rem; align-items: center; padding: .35rem .6rem;
    overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  #branch-pager .mini {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: .12rem .45rem; font-size: .68rem; flex: 0 0 auto;
  }
  #branch-pager .mini:disabled { opacity: .35; }
  #branch-pager .mini:not(:disabled):hover { color: var(--link); border-color: var(--accent-soft); }
  #branch-pager .branch-info { font-size: .68rem; color: var(--muted); margin-left: auto; flex: 0 0 auto; }
  #closed-panel {
    border-bottom: 1px solid var(--line); background: var(--bg);
    padding: .35rem .6rem; flex-shrink: 0; max-height: 9rem; overflow-y: auto;
  }
  /* Chat area is gated on Lean readiness — hidden until install completes. */
  #tabs, #branch-pager, #messages, footer { display: none; }
  .closed-item {
    display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    padding: .3rem 0; font-size: .8rem; color: var(--muted);
  }
  .closed-item button {
    background: var(--accent-deep); color: #fff; border: 1px solid var(--accent-soft);
    border-radius: 6px; padding: .2rem .55rem; font-size: .72rem; flex: 0 0 auto;
  }
  .closed-empty { font-size: .78rem; color: var(--muted); padding: .2rem 0; }
  .tab-rename {
    background: transparent; border: 0; color: #777; padding: 0 .2rem; font-size: .8rem;
  }
  .tab-rename:hover { color: var(--link); }
  .tab-edit {
    background: var(--bg); border: 1px solid var(--accent-soft); color: var(--ink);
    border-radius: 6px; padding: .3rem .45rem; font-size: .8rem; max-width: 140px;
  }
  #messages {
    flex: 1 1 auto; overflow-y: auto; padding: .8rem .6rem 1rem;
  }
  .msg { max-width: 88%; margin: .5rem 0; display: flex; flex-direction: column; }
  .msg.user { align-self: flex-end; align-items: flex-end; margin-left: auto; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; margin-right: auto; }
  .msg .author { font-size: .68rem; color: #8c93a3; margin: 0 .2rem .15rem; }
  .msg .body {
    padding: .5rem .65rem; border-radius: 12px; font-size: .9rem; line-height: 1.45;
    overflow-wrap: break-word; word-break: break-word;
  }
  .msg.user .body { background: var(--accent-deep); color: #fff; border-top-right-radius: 4px; }
  .msg.assistant .body { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .msg.pending .body { color: var(--muted); font-style: italic; }
  .typing { display: inline-flex; gap: 4px; padding: .25rem 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: tblink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes tblink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .msg .body p { margin: .25rem 0; }
  .msg .body p:first-child { margin-top: 0; }
  .msg .body p:last-child { margin-bottom: 0; }
  .msg .body h1, .msg .body h2, .msg .body h3, .msg .body h4, .msg .body h5, .msg .body h6 {
    margin: .6rem 0 .3rem; line-height: 1.2; font-weight: 600;
  }
  .msg .body h1 { font-size: 1.2rem; }
  .msg .body h2 { font-size: 1.08rem; }
  .msg .body h3 { font-size: 1rem; }
  .msg .body ul, .msg .body ol { margin: .3rem 0; padding-left: 1.3rem; }
  .msg .body li { margin: .15rem 0; }
  .msg .body code {
    font-family: 'Intel One Mono', ui-monospace, monospace; background: #141821; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 .3rem; font-size: .82em;
  }
  .msg .body pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .7rem; overflow-x: auto; margin: .4rem 0;
  }
  .msg .body pre code { background: transparent; border: 0; padding: 0; font-size: .8rem; }
  .msg .body blockquote { border-left: 3px solid var(--accent-soft); margin: .4rem 0; padding: .1rem .6rem; color: #b8c0cf; }
  .msg .body table { border-collapse: collapse; margin: .4rem 0; width: 100%; font-size: .82rem; }
  .msg .body th, .msg .body td { border: 1px solid var(--line); padding: .3rem .5rem; text-align: left; }
  .msg .body th { background: var(--panel-2); color: var(--accent); }
  .msg .body a { color: var(--link); }
.msg .body hr { border: 0; border-top: 1px solid var(--line); margin: .6rem 0; }
   .msg .meta { display: flex; gap: .3rem; margin-top: .2rem; }
   .msg .meta .mini {
     background: transparent; border: 1px solid var(--line); color: var(--muted);
     border-radius: 6px; padding: .12rem .45rem; font-size: .68rem;
   }
   .msg .meta .mini:hover { color: var(--link); border-color: var(--accent-soft); }
   .tools { display: flex; flex-direction: column; gap: .15rem; margin-top: .25rem; }
   .tool-line { font-size: .72rem; color: var(--muted); font-family: 'Intel One Mono', ui-monospace, monospace; }
   .phase { display: inline-block; font-style: italic; color: var(--muted); padding: .2rem .4rem; background: var(--panel); border-radius: 4px; }
   footer {
     flex-shrink: 0; padding: .55rem; border-top: 1px solid var(--line); background: var(--bg);
     display: flex; gap: .45rem; align-items: flex-end;
   }
  #composer {
    flex: 1 1 auto; resize: none; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: .6rem; font-size: .92rem;
    min-height: 5.1rem; max-height: 8rem; font-family: inherit; line-height: 1.4;
  }
  #composer:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent-deep); color: #fff; border: 1px solid var(--accent-soft); border-radius: 10px;
    padding: .6rem 1rem; font-size: .9rem; flex: 0 0 auto;
  }
  #send-btn:disabled { background: #33505f; border-color: #33505f; }
   .toast {
     position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
     background: var(--panel); border: 1px solid var(--accent-soft); color: var(--ink);
     padding: .5rem 1rem; border-radius: 8px; font-size: .85rem; z-index: 1000;
     animation: toast-in .2s ease-out;
   }
   @keyframes toast-in { from { opacity: 0; bottom: .8rem; } to { opacity: 1; bottom: 1.2rem; } }
   .msg { cursor: pointer; }
</style>
</head>
<body>
<div id="lean-overlay">
  <div class="logo">⚙</div>
  <div class="title">Installing Lean…</div>
  <div class="detail" id="lean-overlay-detail">Preparing installation</div>
  <div class="progress-bar"><div class="progress-fill" id="lean-overlay-fill"></div></div>
  <div class="pct" id="lean-overlay-pct">0%</div>
  <div class="steps-list" id="lean-steps-list">
    <div class="step" data-step="download">Download Lean archive (~550 MB)</div>
    <div class="step" data-step="extract">Extract into container (/usr/local)</div>
    <div class="step" data-step="ldconfig">Register shared libraries (ldconfig)</div>
    <div class="step" data-step="probe">Verify Lean runtime (lean --version)</div>
    <div class="step" data-step="warm">Warm up runtime (page-cache preload)</div>
  </div>
</div>
<header>
  <div class="row between">
    <div class="brand"><span class="dot" id="conn-dot"></span><h1>ForgeRig</h1><span id="status-pill">Connecting…</span></div>
    <button id="settings-btn" onclick="window.NativeHost && NativeHost.openSettings && NativeHost.openSettings()">⚙ Settings</button>
  </div>
  <div class="row between"><span id="status">Connecting…</span><span id="provider-line"><span id="provider"></span><span class="pill" id="key-pill" style="display:none"></span><span class="pill" id="lean-pill" style="display:none"></span></span></div>
  <div class="row between">
    <span id="lean-status">Lean: —</span>
    <button id="lean-btn">Download &amp; install Lean (~550 MB)</button>
  </div>
  <div id="lean-bar"><div id="lean-fill"></div><div id="lean-pct">0%</div></div>
  <div id="setup-notice"><span id="setup-notice-text"></span><button id="setup-notice-btn" onclick="window.NativeHost && NativeHost.openSettings && NativeHost.openSettings()">Open Settings</button></div>
</header>

<div id="tabs"><button id="new-session">+ New</button><button id="history-btn" title="Reopen closed tab">🕘</button><div id="tab-list" style="display:flex;gap:.3rem;"></div></div>
<div id="branch-pager"></div>
<div id="closed-panel" style="display:none"><div id="closed-list"></div></div>
<main id="messages"></main>
<footer id="composer-bar">
  <textarea id="composer" placeholder="Ask anything… (Enter to send, Shift+Enter for newline, !cmd runs in the container)" autofocus></textarea>
  <button id="send-btn">Send</button>
</footer>

<script>
/*@MARKDOWN_JS@*/
/*@STATE_JS@*/
/*@APP_JS@*/
</script>
</body>
</html>
