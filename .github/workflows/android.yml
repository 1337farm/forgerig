name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Merges landed by the automerge job are pushed with GITHUB_TOKEN, and
  # GitHub does not raise `push` workflow events for such pushes (documented
  # behavior). workflow_dispatch is the sanctioned exception, so the automerge
  # job uses it to rebuild and republish the rolling `latest` release from the
  # canonical main HEAD. Maintainers can also use "Run workflow" to republish.
  workflow_dispatch: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest -PskipContainerAssetsCheck --stacktrace

  package-apk:
    name: apk
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/prepare-assets.sh

      # Distributed Rust compiler cache (GHA backend). Warms cold builds;
      # per-branch incremental state comes from the cargo target cache below.
      - name: Setup sccache
        uses: 1337farm/actions/setup-sccache@v1

      # Caches ~/.cargo/registry and daemon/target. The shared-key pins the
      # cross target + feature set: bump it if either changes, otherwise a
      # stale cache would silently rebuild with the wrong flags.
      - name: Cache Rust build
        uses: 1337farm/actions/cache-cargo@v1
        with:
          workspaces: daemon
          shared-key: aarch64-unknown-linux-musl_vendored-openssl

      # Full aarch64 musl cross toolchain (rusqlite needs a real cross cc).
      # Restores from cache on hit; on miss downloads via multi-mirror fallback
      # and re-seeds the cache. Exports CC/AR_*_aarch64_unknown_linux_musl and
      # prepends bin/ to PATH for the build step below.
      - name: Cache musl cross toolchain
        uses: 1337farm/actions/cache-musl-toolchain@v1

      - name: Prepare container assets (proot + rootfs + daemon)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -e
          if ! command -v rustup >/dev/null 2>&1; then
            export RUSTUP_HOME="$RUNNER_TEMP/rustup"
            export CARGO_HOME="$RUNNER_TEMP/cargo"
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$CARGO_HOME/env"
          fi
          rustup target add aarch64-unknown-linux-musl
          rustc --version && cargo --version
          FORGERIG_CARGO_TARGET=aarch64-unknown-linux-musl \
          FORGERIG_CARGO_FEATURES=vendored-openssl \
          bash scripts/prepare-assets.sh

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeRig-Release-APK
          path: app/build/outputs/apk/release/forgerig-*.apk
          retention-days: 7

      - name: Publish APK release
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/apk-release"
          mkdir -p "$OUT"
          APK="$(find app/build/outputs/apk/release -name 'forgerig-*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "ERROR: no forgerig-*.apk to publish (hash rename missing?)"; return 1; fi
          cp "$APK" "$OUT/"
          APK_NAME="$(basename "$APK")"
          SHA="$(git rev-parse --short=10 HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUM="$(sha256sum "$OUT/$APK_NAME" | cut -d' ' -f1)"
          printf '{"commit":"%s","built_at":"%s","abi":"arm64-v8a","files":{"%s":"%s"}}\n' \
            "$SHA" "$DATE" "$APK_NAME" "$SUM" > "$OUT/apk-manifest.json"
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest "$OUT/$APK_NAME" "$OUT/apk-manifest.json" --repo "${{ github.repository }}" \
            --title "ForgeRig APK (latest)" \
            --notes "Rolling sideloadable release APK built from source. Re-published on every green build."

  automerge:
    name: Auto-merge PR
    needs: [package-apk]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --delete-branch

      - name: Rebuild and republish latest from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN-created merges do not trigger `push` events, so dispatch
          # the pipeline on the (now updated) main branch instead.
          gh workflow run android.yml --repo "${{ github.repository }}" --ref main
