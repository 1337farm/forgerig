name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Merges landed by the automerge job are pushed with GITHUB_TOKEN, and
  # GitHub does not raise `push` workflow events for such pushes (documented
  # behavior). workflow_dispatch is the sanctioned exception, so the automerge
  # job uses it to rebuild and republish the rolling `latest` release from the
  # canonical main HEAD. Maintainers can also use "Run workflow" to republish.
  workflow_dispatch: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest -PskipContainerAssetsCheck --stacktrace

  package-apk:
    name: apk
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/prepare-assets.sh

      - name: Prepare container assets (proot + rootfs + daemon)
        run: |
          set -e
          if ! command -v rustup >/dev/null 2>&1; then
            export RUSTUP_HOME="$RUNNER_TEMP/rustup"
            export CARGO_HOME="$RUNNER_TEMP/cargo"
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$CARGO_HOME/env"
          fi
          rustup target add aarch64-unknown-linux-musl

          # Full aarch64 musl cross toolchain: rusqlite bundles libsqlite3 and is
          # compiled with the `cc` crate, which needs a real cross compiler.
          # musl.cc is a single-host mirror that GH runners sometimes cannot reach
          # (TCP connect times out); fall back to copies hosted on GitHub's CDN.
          TOOLCHAIN_BIN=""
          for URL in \
            "https://musl.cc/aarch64-linux-musl-cross.tgz" \
            "https://github.com/libviprs/libviprs-dep/releases/download/musl-cross-mirror/aarch64-linux-musl-cross.tgz" \
            "https://github.com/arceos-org/setup-musl/releases/download/prebuilt/aarch64-linux-musl-cross.tgz"; do
            if curl -fL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
                -o "$RUNNER_TEMP/musl.tgz" "$URL"; then
              tar xzf "$RUNNER_TEMP/musl.tgz" -C "$RUNNER_TEMP"
              TOOLCHAIN_GCC="$(find "$RUNNER_TEMP" -maxdepth 3 -type f -name aarch64-linux-musl-gcc | head -1)"
              if [ -n "$TOOLCHAIN_GCC" ]; then
                TOOLCHAIN_BIN="$(dirname "$TOOLCHAIN_GCC")"
                break
              fi
              rm -rf "$RUNNER_TEMP/musl.tgz" "$RUNNER_TEMP/aarch64-linux-musl*"
            fi
          done
          if [ -z "$TOOLCHAIN_BIN" ]; then
            echo "ERROR: could not download any aarch64 musl toolchain" >&2
            exit 1
          fi
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc
          export AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar

          rustc --version && cargo --version
          aarch64-linux-musl-gcc --version | head -1
          FORGERIG_CARGO_TARGET=aarch64-unknown-linux-musl \
          FORGERIG_CARGO_FEATURES=vendored-openssl \
          bash scripts/prepare-assets.sh

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeRig-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Publish APK release
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/apk-release"
          mkdir -p "$OUT"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "ERROR: no APK to publish"; return 1; fi
          cp "$APK" "$OUT/"
          APK_NAME="$(basename "$APK")"
          SHA="$(git rev-parse --short=10 HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUM="$(sha256sum "$OUT/$APK_NAME" | cut -d' ' -f1)"
          printf '{"commit":"%s","built_at":"%s","abi":"arm64-v8a","files":{"%s":"%s"}}\n' \
            "$SHA" "$DATE" "$APK_NAME" "$SUM" > "$OUT/apk-manifest.json"
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest "$OUT/$APK_NAME" "$OUT/apk-manifest.json" --repo "${{ github.repository }}" \
            --title "ForgeRig APK (latest)" \
            --notes "Rolling sideloadable release APK built from source. Re-published on every green build."

  automerge:
    name: Auto-merge PR
    needs: [package-apk]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --delete-branch

      - name: Rebuild and republish latest from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN-created merges do not trigger `push` events, so dispatch
          # the pipeline on the (now updated) main branch instead.
          gh workflow run android.yml --repo "${{ github.repository }}" --ref main
