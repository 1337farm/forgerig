name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Merges landed by the automerge job are pushed with GITHUB_TOKEN, and
  # GitHub does not raise `push` workflow events for such pushes (documented
  # behavior). workflow_dispatch is the sanctioned exception, so the automerge
  # job uses it to rebuild and republish the rolling `latest` release from the
  # canonical main HEAD. Maintainers can also use "Run workflow" to republish.
  workflow_dispatch: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest -PskipContainerAssetsCheck --stacktrace

  package-apk:
    name: apk
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 120
    permissions:
      contents: write
      # For the cargo target + sccache saves below (cache-cargo/setup-sccache
      # use the actions backend). Without this the composites only "restore"
      # into an empty cache and every run is cold.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/prepare-assets.sh

      # --- Container-assets cache (rolling release restore) ------------------
      # The container assets (rootfs + proot stack + baked daemon) are the slow
      # part of every run: cargo cross-compile plus Alpine/Termux downloads.
      # Publish them as a source-tree-bound rolling release (same pattern as
      # dep-*-latest/engine-latest in flashforge-farm) and restore before paying
      # that cost. The bundle only depends on daemon/ + scripts/prepare-assets.sh
      # (subtree SHAs), so UI-only PRs and the post-merge main dispatch reuse
      # the last verified pack instead of rebuilding.
      - name: Restore container assets from release
        id: assets-rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HIT=0
          DL="$RUNNER_TEMP/rel-assets"; mkdir -p "$DL"
          if gh release download assets-latest --pattern 'container-assets.tar.gz' --pattern 'assets-manifest.json' \
               --dir "$DL" --clobber >/dev/null 2>&1; then
            MAN="$DL/assets-manifest.json"
            DAEMON_SRC="$(git rev-parse HEAD:daemon 2>/dev/null || true)"
            PREPARE_SRC="$(git rev-parse HEAD:scripts/prepare-assets.sh 2>/dev/null || true)"
            WANT_DAEMON="$(python3 -c "import json;print(json.load(open('$MAN')).get('daemon_src',''))" 2>/dev/null || true)"
            WANT_PREPARE="$(python3 -c "import json;print(json.load(open('$MAN')).get('prepare_src',''))" 2>/dev/null || true)"
            if [ -z "$DAEMON_SRC" ] || [ -z "$PREPARE_SRC" ] \
               || [ "$DAEMON_SRC" != "$WANT_DAEMON" ] || [ "$PREPARE_SRC" != "$WANT_PREPARE" ]; then
              echo "container-asset sources changed since release (daemon/prepare $DAEMON_SRC/$PREPARE_SRC vs $WANT_DAEMON/$WANT_PREPARE); rebuilding"
            else
              # Verify member shas from the archive WITHOUT touching the
              # workspace: a poison archive must never land in the APK.
              STAGE="$DL/stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
              OK=1
              FILES="assets/ubuntu-rootfs.bin assets/libtalloc.so.2 jniLibs/arm64-v8a/libproot.so jniLibs/arm64-v8a/libproot_loader.so jniLibs/arm64-v8a/libandroid-shmem.so"
              for F in $FILES; do
                EXP="$(python3 -c "import json;print(json.load(open('$MAN'))['files'].get('$F',''))" 2>/dev/null || true)"
                GOT="$(tar xzf "$DL/container-assets.tar.gz" -O "$F" 2>/dev/null | sha256sum | cut -d' ' -f1)"
                if [ -z "$EXP" ] || [ "$EXP" != "$GOT" ]; then
                  echo "container-asset $F sha mismatch (got=$GOT); rebuilding"
                  OK=0; break
                fi
              done
              if [ "$OK" = 1 ]; then
                # Quality gate: the rootfs must contain the baked daemon and the
                # proot stack must keep both DT_NEEDED runtimes, or a poison
                # release could ship a broken container.
                tar xzf "$DL/container-assets.tar.gz" -O assets/ubuntu-rootfs.bin > "$STAGE/rootfs.bin" 2>/dev/null
                tar xzf "$DL/container-assets.tar.gz" -O jniLibs/arm64-v8a/libproot.so > "$STAGE/libproot.so" 2>/dev/null
                if ! tar tzf "$STAGE/rootfs.bin" 2>/dev/null | grep -q '^usr/bin/forgerig-daemon$' \
                   || ! readelf -d "$STAGE/libproot.so" 2>/dev/null | grep -q 'NEEDED.*libtalloc.so.2' \
                   || ! readelf -d "$STAGE/libproot.so" 2>/dev/null | grep -q 'NEEDED.*libandroid-shmem.so'; then
                  echo "container-assets release failed quality gate; rebuilding"
                else
                  tar xzf "$DL/container-assets.tar.gz" -C "$GITHUB_WORKSPACE/app/src/main"
                  HIT=1
                  echo "container assets release verified and staged (no rebuild)"
                fi
              fi
            fi
          else
            echo "no usable assets-latest release; continuing"
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Compute native build need
        id: build-needed
        run: |
          NEED=1
          if [ "${{ steps.assets-rel.outputs.hit }}" = "1" ]; then
            NEED=0
          fi
          echo "needed=$NEED" >> "$GITHUB_OUTPUT"

      # Distributed Rust compiler cache (GHA backend). Warms cold builds;
      # per-branch incremental state comes from the cargo target cache below.
      - name: Setup sccache
        if: steps.build-needed.outputs.needed == '1'
        uses: 1337farm/actions/setup-sccache@v1

      # Caches ~/.cargo/registry and daemon/target. The shared-key pins the
      # cross target + feature set: bump it if either changes, otherwise a
      # stale cache would silently rebuild with the wrong flags.
      - name: Cache Rust build
        if: steps.build-needed.outputs.needed == '1'
        uses: 1337farm/actions/cache-cargo@v1
        with:
          workspaces: daemon
          shared-key: aarch64-unknown-linux-musl_vendored-openssl

      # Full aarch64 musl cross toolchain (rusqlite needs a real cross cc).
      # Restores from cache on hit; on miss downloads via multi-mirror fallback
      # and re-seeds the cache. Exports CC/AR_*_aarch64_unknown_linux_musl and
      # prepends bin/ to PATH for the build step below.
      - name: Cache musl cross toolchain
        if: steps.build-needed.outputs.needed == '1'
        uses: 1337farm/actions/cache-musl-toolchain@v1

      - name: Prepare container assets (proot + rootfs + daemon)
        if: steps.build-needed.outputs.needed == '1'
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -e
          if ! command -v rustup >/dev/null 2>&1; then
            export RUSTUP_HOME="$RUNNER_TEMP/rustup"
            export CARGO_HOME="$RUNNER_TEMP/cargo"
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$CARGO_HOME/env"
          fi
          rustup target add aarch64-unknown-linux-musl
          rustc --version && cargo --version
          FORGERIG_CARGO_TARGET=aarch64-unknown-linux-musl \
          FORGERIG_CARGO_FEATURES=vendored-openssl \
          bash scripts/prepare-assets.sh

      - name: Publish container-assets release
        # Anything that had to rebuild the container assets backfills the
        # rolling tag on ANY branch (PR / push / dispatch), like the APK
        # publish: a later run with the same daemon/prepare source restores
        # instead of downloading Alpine + Termux proot and cross-compiling.
        # Poison-proof: restored releases never republish (rel hit => skip),
        # and only a fresh build that passed prepare-assets reaches this step.
        if: steps.assets-rel.outputs.hit != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/assets-release"; mkdir -p "$OUT"
          ASSETS="$GITHUB_WORKSPACE/app/src/main"
          ( cd "$ASSETS" && tar czf "$OUT/container-assets.tar.gz" \
              assets/ubuntu-rootfs.bin assets/libtalloc.so.2 \
              jniLibs/arm64-v8a/libproot.so jniLibs/arm64-v8a/libproot_loader.so \
              jniLibs/arm64-v8a/libandroid-shmem.so )
          # PR runs check out the synthetic refs/pull/N/merge ref, so name the
          # manifest after the real PR head SHA (same idiom as the APK publish).
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          SHA="$(printf '%s' "$SHA" | cut -c1-10)"
          DAEMON_SRC="$(git rev-parse HEAD:daemon)"
          PREPARE_SRC="$(git rev-parse HEAD:scripts/prepare-assets.sh)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$OUT" "$ASSETS" "$SHA" "$DATE" "$DAEMON_SRC" "$PREPARE_SRC" <<'PY'
          import hashlib, json, sys
          out, assets, sha, date, daemon_src, prepare_src = sys.argv[1:]
          files = {}
          for rel in [
              "assets/ubuntu-rootfs.bin",
              "assets/libtalloc.so.2",
              "jniLibs/arm64-v8a/libproot.so",
              "jniLibs/arm64-v8a/libproot_loader.so",
              "jniLibs/arm64-v8a/libandroid-shmem.so",
          ]:
              with open(f"{assets}/{rel}", "rb") as fh:
                  files[rel] = hashlib.sha256(fh.read()).hexdigest()
          manifest = {
              "commit": sha,
              "built_at": date,
              "daemon_src": daemon_src,
              "prepare_src": prepare_src,
              "files": files,
          }
          with open(f"{out}/assets-manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY
          gh release delete assets-latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create assets-latest "$OUT/container-assets.tar.gz" "$OUT/assets-manifest.json" \
            --repo "${{ github.repository }}" \
            --title "ForgeRig container assets (latest)" \
            --notes "Rolling release of the packaged rootfs + proot stack + baked daemon. Re-published whenever the container assets rebuild; restored by runs with identical daemon/ and scripts/prepare-assets.sh trees."

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ForgeRig-Release-APK
          path: app/build/outputs/apk/release/forgerig-*.apk
          # 30-day retention protects the post-merge reuse window: a merged
          # PR's APK artifact stays downloadable while the dispatched main
          # rebuild/republish lands.
          retention-days: 30

      - name: Publish APK release
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/apk-release"
          mkdir -p "$OUT"
          APK="$(find app/build/outputs/apk/release -name 'forgerig-*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "ERROR: no forgerig-*.apk to publish (hash rename missing?)"; return 1; fi
          # PR runs check out the synthetic refs/pull/N/merge ref, so git HEAD at
          # build time is a commit that exists in no branch. Name the artifact
          # after the real PR head SHA instead so the hash is traceable.
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          SHA="$(printf '%s' "$SHA" | cut -c1-10)"
          APK_NAME="forgerig-release-$SHA.apk"
          cp "$APK" "$OUT/$APK_NAME"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SUM="$(sha256sum "$OUT/$APK_NAME" | cut -d' ' -f1)"
          printf '{"commit":"%s","built_at":"%s","abi":"arm64-v8a","files":{"%s":"%s"}}\n' \
            "$SHA" "$DATE" "$APK_NAME" "$SUM" > "$OUT/apk-manifest.json"
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest "$OUT/$APK_NAME" "$OUT/apk-manifest.json" --repo "${{ github.repository }}" \
            --title "ForgeRig APK (latest)" \
            --notes "Rolling sideloadable release APK built from source. Re-published on every green build."

  automerge:
    name: Auto-merge PR
    needs: [package-apk]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --delete-branch

      - name: Rebuild and republish latest from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN-created merges do not trigger `push` events, so dispatch
          # the pipeline on the (now updated) main branch instead.
          gh workflow run android.yml --repo "${{ github.repository }}" --ref main
